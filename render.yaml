# Configuração do Render (https://render.com) para publicar o Software Quest de graça.
# No painel do Render: New > Blueprint > escolha este repositório.
# O Render vai pedir o valor de DATABASE_URL: cole a "connection string" do banco gratuito do Neon.
services:
  - type: web
    name: software-quest
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node servidor.js
    healthCheckPath: /api/saude
    envVars:
      - key: DATABASE_URL 'postgresql://neondb_owner:npg_3ZVQJmBMo9bN@ep-square-sky-b60s0753-pooler.c-2.sa-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require'
        sync: false
      - key: NODE_VERSION
        value: '22'
