# Integração contínua: a cada envio ao GitHub, confere formatação, código e testes.
# O resultado aparece na aba "Actions" do repositório e ao lado de cada commit.
name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Conferir formatação (Prettier)
        run: npm run format:check

      - name: Verificar código (ESLint e Stylelint)
        run: npm run lint

      - name: Rodar testes
        run: npm test
